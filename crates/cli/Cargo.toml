[package]
name = "trimbox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interface en ligne de commande et interface graphique optionnelle pour Trimbox."
repository.workspace = true

[[bin]]
name = "trimbox"
path = "src/main.rs"

[features]
default = []
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:lopdf", "dep:serde", "dep:serde_json"]

[dependencies]
trimbox-core.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
slint = { workspace = true, optional = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }
lopdf = { workspace = true, optional = true }
serde = { version = "1", default-features = true, features = ["derive"], optional = true }
serde_json = { version = "1", default-features = true, optional = true }

[build-dependencies]
slint-build = { workspace = true, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
lopdf.workspace = true
tempfile = "3"